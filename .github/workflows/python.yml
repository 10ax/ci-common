# Reusable Python lane: lint / test / optional coverage, one leg per version.
#
# Warnings, not gates: nothing here is a required check — a red run is a
# signal, not a block. Callers must be repos owned by the same account.
#
# Rationale and open points: SecondBrain 000-Inbox/quality-gates-repo-personali.md
#
# Caller example:
#   jobs:
#     ci:
#       uses: 10ax/ci-common/.github/workflows/python.yml@v1
#       with:
#         python-versions: '["3.11"]'
#         lint: |
#           python -m compileall -q app scripts
#           ruff check .
#         coverage-args: "--cov=app --cov=scripts"

name: python

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions; one leg each for lint/test/coverage"
        type: string
        default: '["3.12"]'
      cache:
        description: "setup-python cache (pip/poetry/pipenv); empty disables it (repos without a manifest)"
        type: string
        default: "pip"
      install:
        description: "Command that installs the dependencies"
        type: string
        default: "pip install -r requirements.txt -r requirements-dev.txt"
      extras:
        description: "Extra shell after install in test/coverage (multi-line ok; e.g. system packages)"
        type: string
        default: ""
      lint:
        type: string
        default: "ruff check ."
      test:
        type: string
        default: "pytest -q"
      coverage-args:
        description: "pytest-cov arguments; when non-empty, enables the coverage job"
        type: string
        default: ""
      coverage-threshold:
        description: "Below this the coverage job goes red (a warning, it does not block)"
        type: number
        default: 90

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, so don't leave an authenticated remote in
          # .git/config for later steps to use.
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: inputs.cache != ''
        with:
          python-version: ${{ matrix.python-version }}
          cache: ${{ inputs.cache }}
      - uses: actions/setup-python@v7
        if: inputs.cache == ''
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: ${{ inputs.install }}
      - name: Lint
        run: ${{ inputs.lint }}

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs run to completion: knowing a failure is version-specific is
      # the whole point of having more than one.
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: inputs.cache != ''
        with:
          python-version: ${{ matrix.python-version }}
          cache: ${{ inputs.cache }}
      - uses: actions/setup-python@v7
        if: inputs.cache == ''
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: ${{ inputs.install }}
      - name: Extras
        if: inputs.extras != ''
        run: ${{ inputs.extras }}
      - name: Test
        run: ${{ inputs.test }}

  coverage:
    name: coverage (${{ matrix.python-version }})
    if: inputs.coverage-args != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: inputs.cache != ''
        with:
          python-version: ${{ matrix.python-version }}
          cache: ${{ inputs.cache }}
      - uses: actions/setup-python@v7
        if: inputs.cache == ''
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: ${{ inputs.install }}
      - name: Extras
        if: inputs.extras != ''
        run: ${{ inputs.extras }}
      - name: Coverage
        run: |
          pip install pytest-cov
          ${{ inputs.test }} ${{ inputs.coverage-args }} \
            --cov-report=term-missing \
            --cov-fail-under=${{ inputs.coverage-threshold }}
